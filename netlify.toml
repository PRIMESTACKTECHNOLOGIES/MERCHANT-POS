# ─────────────────────────────────────────────────────────────────────────────
# Netlify build config for the CUSTOMER WALLET PORTAL (portal-only bundle).
#
# Create the Netlify site against this repository and leave the site's
# "Base directory" EMPTY. Netlify reads netlify.toml from the base directory,
# so an empty base means this file is used. (The legacy merchant-dashboard site
# is a different Netlify site whose base is `client`, so it keeps using
# client/netlify.toml and is unaffected by this file.)
#
# Build & deploy settings can stay on "read from netlify.toml".
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command = "cd client && npm ci && npm run build:portal"
  publish = "client/dist-portal"

[build.environment]
  # REQUIRED. The portal is static on Netlify but its API lives on Render.
  # Without this, resolveApiBaseUrl() falls back to the Netlify origin and every
  # /api/customer-auth and /api/customer-portal call 404s.
  VITE_API_URL = "https://merchant-pos-0nno.onrender.com"

# SPA fallback so deep links (/portal/login, /portal/overview, ...) resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=15552000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self), clipboard-write=(self), usb=(self), serial=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' data: blob: https:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' https: wss:; frame-src 'self' https: blob:"
