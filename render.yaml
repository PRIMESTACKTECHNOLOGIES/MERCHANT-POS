services:
  # Backend API server (Docker)
  - type: web
    name: pos-offline-api
    env: docker
    plan: free
    branch: main
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: PARTNER_ACCESS_TOKEN
        sync: false
      - key: TRANSAK_API_BASE_URL
        value: https://api-gateway.transak.com/api/v2
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pos-postgres
          property: connectionString

databases:
  - name: pos-postgres
    databaseName: pos_offline
    user: pos_offline_user
    plan: free
