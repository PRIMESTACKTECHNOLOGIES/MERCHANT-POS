services:
  # ── PRIMESTACK MERCHANT POS — Backend API + Frontend ─────────────────────────
  - type: web
    name: merchant-pos-api
    env: docker
    plan: starter
    branch: main
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: merchant-pos-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # ── Runtime ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_PATH
        value: /app/data/database.sqlite
      - key: SERVE_FRONTEND
        value: "true"
      # Runtime frontend API origin override. Injected by backend into
      # window.APP_CONFIG.api_url at boot (no client rebuild needed).
      # Accepted env var names (checked in order): API_URL / VITE_API_URL / APP_CONFIG_API_URL
      # Set this to the Render HTTPS URL of THIS service so the dashboard
      # always points at the correct backend even if you swap domains later.
      - key: VITE_API_URL
        value: "https://merchant-pos-0nno.onrender.com"
      - key: ENABLE_RUNTIME_API_URL
        value: "true"

      # ── JWT / Auth ─────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_LOGIN_USERNAME
        value: admin
      - key: ADMIN_LOGIN_PASSWORD
        sync: false

      # ── Card Processor ─────────────────────────────────────────────────────
      - key: CARD_PROCESSOR_ENABLED
        value: "true"
      - key: CARD_PROCESSOR_URL
        value: https://processor.primestack-tech.com/api/v1/capture
      - key: CARD_PROCESSOR_LOOKUP_URL
        value: https://processor.primestack-tech.com/api/v1/lookup
      - key: CARD_PROCESSOR_CAPTURE_URL
        value: https://processor.primestack-tech.com/api/v1/capture
      - key: CARD_PROCESSOR_KEY
        sync: false

      # ── Processor Identity ─────────────────────────────────────────────────
      - key: PROCESSOR_NAME
        value: PRIMESTACK PAYMENT PROCESSOR
      - key: PROCESSOR_MODEL
        value: PRIMESTACK-POS-201.3
      - key: PROCESSOR_VERSION
        value: 2.1.3
      - key: PROCESSOR_PROTOCOL
        value: "201.3"
      - key: PROCESSOR_MERCHANT_ID
        value: MRC-1001
      - key: PROCESSOR_TERMINAL_ID
        value: T2013-001
      - key: DEFAULT_TID
        value: T2013-001
      - key: MCC
        value: "5999"
      - key: PROCESSOR_FLOOR_LIMIT
        value: "150000"
      - key: PROCESSOR_API_KEY
        sync: false
      - key: PROCESSOR_SECRET_KEY
        sync: false
      - key: PROCESSOR_KEY_ID
        value: PRIMESTACK-B4C329F83258
      - key: ISSUER_SECRET_KEY
        sync: false
      - key: API_KEYS
        sync: false

      # ── Vault Bank ─────────────────────────────────────────────────────────
      - key: VAULT_BANK_PORT
        value: "9001"
      - key: VAULT_BANK_BIND_HOST
        value: 127.0.0.1
      - key: VAULT_BANK_API_KEY
        sync: false
      - key: VAULT_BANK_SECRET_KEY
        sync: false
      - key: VAULT_BANK_TRANSFER_URL
        value: https://merchant-pos-0nno.onrender.com/api/vault-bank/settlement
      - key: VAULT_ACTIVE_API_KEY
        sync: false
      - key: VAULT_EXTERNAL_LOAD_HMAC_SECRET
        sync: false
      - key: VAULT_BANK_WEBHOOK_SECRET
        sync: false
      - key: VAULT_BANK_MODE
        value: TEST

      # ── Acquirer ───────────────────────────────────────────────────────────
      # http-json mode: calls merchant-pos-api's own /api/vault/card/authorize
      # and /card/capture endpoints (vault.router.ts). Raw TCP cannot reach
      # Render's HTTPS ports, so iso8583-tcp is unusable on Render.
      - key: ACQUIRER_HOST
        value: https://merchant-pos-0nno.onrender.com
      - key: ACQUIRER_PORT
        value: "443"
      - key: ACQUIRER_PROTOCOL
        value: http-json
      - key: ACQUIRER_API_KEY
        sync: false
      - key: ACQUIRER_SECRET_KEY
        sync: false
      - key: ACQUIRER_TIMEOUT_MS
        value: "8000"
      - key: ACQUIRER_MERCHANT_ACCOUNT
        value: MRC-1001

      # ── PAN Encryption ─────────────────────────────────────────────────────
      - key: CARD_ENC_KEY
        sync: false
      - key: PAN_ENCRYPTION_SECRET
        sync: false

      # ── Bank Payout Rail ───────────────────────────────────────────────────
      # iso8583 (TCP acquirer) or dwolla (ACH). Empty = internal acquirer only:
      # the payout is recorded and a SEPA pain.001 / SWIFT MT103 file is still
      # generated for the receiving bank. Set it in the Render dashboard.
      - key: INTERNAL_PAYOUT_DOWNSTREAM
        sync: false

      # ── Merchant IBAN/BIC (SEPA outbound debtor side / MT103 :50K sender) ──
      # Bank data: set in the Render dashboard (sync: false), never committed.
      - key: MERCHANT_IBAN
        sync: false
      - key: MERCHANT_BIC
        sync: false

      # ── Receiving bank account (merchant receiver of settled funds) ────────
      # Overrides the bank account saved in Merchant Settings. Empty = use Settings.
      # Account holder / IBAN / BIC are card-and-bank data: set them in the Render
      # dashboard (sync: false) so they are never committed to the repository.
      - key: MERCHANT_BANK_NAME
        value: ""
      - key: MERCHANT_BANK_ACCOUNT_HOLDER
        sync: false
      - key: MERCHANT_BANK_IBAN
        sync: false
      - key: MERCHANT_BANK_SWIFT_CODE
        sync: false
      - key: MERCHANT_BANK_ACCOUNT_NUMBER
        sync: false
      - key: MERCHANT_BANK_ROUTING_NUMBER
        sync: false
      - key: MERCHANT_BANK_ADDRESS
        value: ""
      - key: MERCHANT_BANK_CURRENCY
        value: ""
      - key: MERCHANT_BANK_COUNTRY
        value: ""

      # ── MT103 outbound wire (ordering institution leg) ─────────────────────
      - key: MT103_SENDER_ACCOUNT
        sync: false
      - key: MT103_SENDER_BIC
        sync: false
      - key: MT103_SENDER_NAME
        sync: false
      - key: MT103_SENDER_ADDRESS
        sync: false

      # ── PAYOUT DESTINATION BANK (blank until a new bank account is set) ────
      - key: PAYOUT_BANK_NAME
        value: ""
      - key: PAYOUT_BANK_ROUTING_NUMBER
        value: ""
      - key: PAYOUT_BANK_ACCOUNT_NUMBER
        value: ""
      - key: PAYOUT_BANK_ACCOUNT_HOLDER
        value: ""
      - key: PAYOUT_BANK_ADDRESS
        value: ""
      - key: PAYOUT_BANK_SWIFT
        value: ""
      - key: PAYOUT_BANK_API_URL
        value: ""

      # ── Binance ────────────────────────────────────────────────────────────
      - key: BINANCE_MODE
        value: live
      - key: BINANCE_BASE_URL
        value: https://api.binance.com
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false

      # ── Exchange Provider Priority ─────────────────────────────────────────
      - key: EXCHANGE_PROVIDER_PRIORITY
        value: binance,transak,tronweb,bscweb,polygonweb,kucoin

      # ── Tron ───────────────────────────────────────────────────────────────
      - key: TRON_PRIVATE_KEY
        sync: false
      - key: TRON_WALLET_ADDRESS
        sync: false
      - key: TRON_API_KEY
        sync: false
      - key: TRON_JWT_SECRET
        sync: false
      - key: TRON_FULL_NODE
        value: https://api.trongrid.io

      # ── Transak ────────────────────────────────────────────────────────────
      - key: TRANSAK_DEMO_MODE
        value: "false"
      - key: TRANSAK_MODE
        value: production
      - key: TRANSAK_API_KEY
        sync: false
      - key: TRANSAK_API_SECRET
        sync: false
      - key: TRANSAK_BASE_URL
        value: https://api-gateway.transak.com
      - key: TRANSAK_PUBLIC_API_URL
        value: https://api.transak.com
      - key: TRANSAK_WIDGET_URL
        value: https://global.transak.com
      - key: TRANSAK_REFERRER_DOMAIN
        value: primestack-tech.com
      - key: TRANSAK_WEBHOOK_SECRET
        sync: false

      # ── Jupiter (Solana DEX) ───────────────────────────────────────────────
      - key: JUPITER_MODE
        value: live
      - key: JUPITER_FORCE_LIVE
        value: "1"
      - key: JUPITER_API_KEY
        sync: false
      - key: JUPITER_BASE_URL
        value: https://quote-api.jup.ag/v6

      # ── KuCoin ─────────────────────────────────────────────────────────────
      - key: KUCOIN_MODE
        value: live

      # ── Cash / Card Top-up ─────────────────────────────────────────────────
      - key: VAULT_CASH_OPERATOR_CODE
        sync: false
      - key: BSCSCAN_API_KEY
        sync: false
      - key: POLYGONSCAN_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false

      # ── ABSA Business Bank (future) ────────────────────────────────────────
      - key: ABSA_ENVIRONMENT
        value: sandbox
      - key: ABSA_CLIENT_ID
        sync: false
      - key: ABSA_CLIENT_SECRET
        sync: false
      - key: ABSA_ACCOUNT_NUMBER
        sync: false
      - key: ABSA_WEBHOOK_SECRET
        sync: false

      # ── Operator Cards ─────────────────────────────────────────────────────
      - key: OPERATOR_CARD_USD_HOLDER
        value: AJI ALOSIOUS
      - key: OPERATOR_CARD_USD_NUMBER
        sync: false
      - key: OPERATOR_CARD_USD_EXPIRY
        value: 05/30
      - key: OPERATOR_CARD_USD_CVV
        sync: false
      - key: OPERATOR_CARD_USD_SCHEME
        value: VISA
      - key: OPERATOR_CARD_USD_CURRENCY
        value: USD
      - key: OPERATOR_CARD_EUR_HOLDER
        value: DANIA ALOSIOUS
      - key: OPERATOR_CARD_EUR_NUMBER
        sync: false
      - key: OPERATOR_CARD_EUR_EXPIRY
        value: 06/29
      - key: OPERATOR_CARD_EUR_CVV
        sync: false
      - key: OPERATOR_CARD_EUR_SCHEME
        value: VISA
      - key: OPERATOR_CARD_EUR_CURRENCY
        value: EUR

      # ── Payout Provider ────────────────────────────────────────────────────
      - key: BANK_PAYOUT_PROVIDER
        value: internal

      # ── Allow legacy crypto rail ───────────────────────────────────────────
      - key: ALLOW_LEGACY_CUSTOMER_CRYPTO_WITHDRAW_RAIL
        value: "1"

      # ── CORS ───────────────────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        value: https://merchantpos.netlify.app,https://merchant-pos-0nno.onrender.com,http://localhost:7001,http://127.0.0.1:7001

      # ── Protocol 101.1 Voice Authorization (fail-closed verification) ──────
      # The POS verifies the merchant's phone-auth code against the vault bank.
      - key: VOICE_AUTH_VERIFY_URL
        value: https://vault-bank-6jcj.onrender.com/api/vault-bank/voice-auth/verify
      - key: VOICE_AUTH_VERIFY_API_KEY
        sync: false
      - key: VOICE_AUTH_VERIFY_SECRET
        sync: false
      - key: VOICE_AUTH_VERIFY_TIMEOUT_MS
        value: "8000"
      - key: VOICE_AUTH_HMAC_SECRET
        sync: false
      - key: VOICE_AUTH_EXPIRY_HOURS
        value: "48"
      - key: VOICE_AUTH_ALLOW_UNVERIFIED
        value: "false"

  # ── VAULT BANK SETTLEMENT SERVER ─────────────────────────────────────────────
  - type: web
    name: vault-bank
    env: docker
    plan: starter
    branch: main
    region: frankfurt
    dockerfilePath: ./Dockerfile.vault
    healthCheckPath: /status
    disk:
      name: vault-bank-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: VAULT_BANK_MODE
        value: TEST
      - key: VAULT_SETTLEMENT_PORT
        value: "9001"
      - key: PORT
        value: "9001"
      - key: VAULT_BANK_TCP_PORT
        value: "9000"
      - key: VAULT_BANK_BIND_HOST
        value: 0.0.0.0
      - key: VAULT_SETTLEMENT_HOST
        value: 127.0.0.1
      - key: VAULT_BANK_OMNIBUS_ID
        value: VAULT_BANK_OMNIBUS
      - key: VAULT_ACTIVE_API_KEY
        sync: false
      - key: VAULT_BANK_API_KEY
        sync: false
      - key: VAULT_BANK_SECRET_KEY
        sync: false
      - key: VAULT_BANK_VOICE_AUTH_SECRET
        sync: false
      - key: OPERATOR_CARD_USD_HOLDER
        value: AJI ALOSIOUS
      - key: OPERATOR_CARD_USD_NUMBER
        sync: false
      - key: OPERATOR_CARD_USD_EXPIRY
        value: 05/30
      - key: OPERATOR_CARD_USD_CVV
        sync: false
      - key: OPERATOR_CARD_USD_SCHEME
        value: VISA
      - key: OPERATOR_CARD_USD_CURRENCY
        value: USD
      - key: OPERATOR_CARD_EUR_HOLDER
        value: DANIA ALOSIOUS
      - key: OPERATOR_CARD_EUR_NUMBER
        sync: false
      - key: OPERATOR_CARD_EUR_EXPIRY
        value: 06/29
      - key: OPERATOR_CARD_EUR_CVV
        sync: false
      - key: OPERATOR_CARD_EUR_SCHEME
        value: VISA
      - key: OPERATOR_CARD_EUR_CURRENCY
        value: EUR
      - key: VAULT_SQLITE_PATH
        value: /app/data/vault.sqlite
