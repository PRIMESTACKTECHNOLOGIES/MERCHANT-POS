# ─────────────────────────────────────────────────────────────────────────────
# PRIMESTACK POS — CI/CD Pipeline
# GitHub Actions → ECR → EKS
#
# Required GitHub Secrets:
#   AWS_ACCOUNT_ID          Your 12-digit AWS account ID
#   AWS_ROLE_ARN            IAM role ARN for OIDC (GitHub → AWS)
#   EKS_CLUSTER_NAME        EKS cluster name
#   AWS_REGION              AWS region (e.g. us-east-1)
#   NPM_TOKEN               npm registry token for private packages
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy to EKS

on:
  push:
    branches:
      - main        # Production deploy
      - staging     # Staging deploy
  pull_request:
    branches:
      - main

permissions:
  id-token: write   # Required for OIDC auth with AWS
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_API: primestack-pos
  IMAGE_VAULT: primestack-vault-bank
  EKS_CLUSTER: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  # ── Job 1: Lint + Type Check ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend install --no-audit --no-fund
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: TypeScript check
        run: npm --prefix backend run build

      - name: Install frontend dependencies
        run: npm --prefix client install --no-audit --no-fund

      - name: Frontend build check
        run: npm --prefix client run build
        env:
          VITE_API_URL: "https://api.primestack-tech.com"

  # ── Job 2: Build & Push Docker Images ────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    outputs:
      api-tag: ${{ steps.meta.outputs.api-tag }}
      vault-tag: ${{ steps.meta.outputs.vault-tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            TAG="${SHORT_SHA}"
            ALIAS="latest"
          else
            TAG="${BRANCH}-${SHORT_SHA}"
            ALIAS="${BRANCH}"
          fi
          echo "api-tag=${TAG}" >> $GITHUB_OUTPUT
          echo "vault-tag=${TAG}" >> $GITHUB_OUTPUT
          echo "alias=${ALIAS}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "ALIAS=${ALIAS}" >> $GITHUB_ENV

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push main API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_API }}:${{ env.TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_API }}:${{ env.ALIAS }}
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_API }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_API }}:buildcache,mode=max

      - name: Build & push vault bank image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.vault
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_VAULT }}:${{ env.TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_VAULT }}:${{ env.ALIAS }}
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_VAULT }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_VAULT }}:buildcache,mode=max

  # ── Job 3: Deploy to Staging ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'staging'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tags in kustomization
        run: |
          cd k8s/overlays/staging
          kustomize edit set image \
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_API }}:staging-${{ github.sha[:8] }} \
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_VAULT }}:staging-${{ github.sha[:8] }}

      - name: Deploy to staging
        run: kustomize build k8s/overlays/staging | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/staging-primestack-api -n primestack-staging --timeout=300s

  # ── Job 4: Deploy to Production ──────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'
    environment: production   # Requires manual approval in GitHub Environments

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          cd k8s/overlays/production
          kustomize edit set image \
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_API }}:${SHORT_SHA} \
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_VAULT }}:${SHORT_SHA}

      - name: Deploy to production
        run: kustomize build k8s/overlays/production | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/primestack-api -n primestack --timeout=300s
          kubectl rollout status deployment/primestack-vault-bank -n primestack --timeout=300s

      - name: Smoke test
        run: |
          API_URL="https://api.primestack-tech.com"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/health")
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED — /health returned HTTP ${STATUS}"
            kubectl rollout undo deployment/primestack-api -n primestack
            exit 1
          fi
          echo "Smoke test PASSED — HTTP 200"
