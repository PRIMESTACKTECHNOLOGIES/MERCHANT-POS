# ═════════════════════════════════════════════════════════════════════════════
# RENDER.COM PRODUCTION DEPLOYMENT CONFIGURATION
# ═════════════════════════════════════════════════════════════════════════════
# 
# DEPLOYMENT INSTRUCTIONS:
# 1. Push this code to GitHub
# 2. Go to https://dashboard.render.com/
# 3. Click "New +" → "Blueprint"
# 4. Connect your GitHub repository
# 5. Click "Apply" - Render will deploy automatically
#
# IMPORTANT: This uses a paid plan (Starter $7/month) for persistent storage.
# Free tier will lose data on every restart - NOT for production!
#
# ═════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: pos-offline-sftwr
    env: docker
    plan: starter  # REQUIRED: Disks need Starter plan ($7/month)
    region: singapore  # Change to closest region: singapore, frankfurt, oregon
    
    # Environment Variables
    envVars:
      - key: PORT
        value: 3000
      
      - key: DATABASE_URL
        value: /var/lib/data/pos_offline.sqlite
      
      - key: NODE_ENV
        value: production
      
      # 🔴 CHANGE THESE SECRETS BEFORE DEPLOYING:
      - key: ADMIN_PASSWORD
        value: ChangeThisToStrongPassword123!
      
      - key: SECRET_KEY
        value: your-jwt-secret-key-min-32-characters-long
      
      - key: MYFATOORAH_TOKEN
        value: ""  # Add your MyFatoorah token here for real payments
      
      - key: MYFATOORAH_TEST_MODE
        value: "false"  # Set to "true" for testing, "false" for LIVE payments
    
    # Persistent Disk for SQLite Database
    # This ensures your data survives restarts and deployments
    disk:
      name: pos_data
      mountPath: /var/lib/data
      sizeGB: 1  # 1GB is plenty for POS data

# ═════════════════════════════════════════════════════════════════════════════
# OPTIONAL: PostgreSQL Database (if you want to upgrade from SQLite)
# ═════════════════════════════════════════════════════════════════════════════
