name: flutter_pos_2013
description: POS-201.3 Cross-Platform (Android + iOS) with Offline Support

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^12.1.1
  
  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # Local Storage
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Background Tasks
  workmanager: ^0.9.0
  background_fetch: ^1.2.1
  
  # Security & Encryption
  encrypt: ^5.0.1
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  local_auth: ^2.1.8
  
  # NFC Support
  nfc_manager: ^3.3.0
  
  # QR Code & Receipt
  qr_flutter: ^4.1.0
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  screenshot: ^2.1.0
  permission_handler: ^11.1.0
  
  # MyFatoorah Integration
  url_launcher: ^6.2.2
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  logger: ^2.0.2+1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Prevent screenshots (FLAG_SECURE equivalent)
  screen_protector: ^1.2.1
  
  # Biometric lock
  local_auth_android: ^1.0.36
  local_auth_ios: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
    - assets/logo/
  
  # App Icons Configuration
  # flutter_launcher_icons package (optional)
  # flutter pub run flutter_launcher_icons:main
  
  # Fonts - Uncomment when font files are available
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
