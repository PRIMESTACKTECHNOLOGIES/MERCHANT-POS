  <body>
    <div id="root"></div>
    <div id="fallback" style="padding:20px;font-family:sans-serif;color:#666;text-align:center;">
      <p>Loading PRIMESTACK POS...</p>
    </div>
    <script>
      // ── Hide fallback when React mounts ──────────────────────────────────
      setTimeout(function(){
        var r=document.getElementById('root');
        if(r&&r.children.length>0){
          var f=document.getElementById('fallback');
          if(f)f.style.display='none';
        }
      },2000);

      // ── Disable right-click context menu ─────────────────────────────────
      document.addEventListener('contextmenu',function(e){
        e.preventDefault();
        return false;
      });

      // ── Disable text selection (Ctrl+A, drag select) ─────────────────────
      document.addEventListener('selectstart',function(e){
        e.preventDefault();
        return false;
      });

      // ── Disable drag (drag to copy) ───────────────────────────────────────
      document.addEventListener('dragstart',function(e){
        e.preventDefault();
        return false;
      });

      // ── Disable keyboard shortcuts used to inspect source ─────────────────
      document.addEventListener('keydown',function(e){
        // F12 — DevTools
        if(e.key==='F12'){e.preventDefault();return false;}
        // Ctrl+Shift+I — DevTools
        if(e.ctrlKey&&e.shiftKey&&e.key==='I'){e.preventDefault();return false;}
        // Ctrl+Shift+J — Console
        if(e.ctrlKey&&e.shiftKey&&e.key==='J'){e.preventDefault();return false;}
        // Ctrl+Shift+C — Inspector
        if(e.ctrlKey&&e.shiftKey&&e.key==='C'){e.preventDefault();return false;}
        // Ctrl+U — View source
        if(e.ctrlKey&&e.key==='u'){e.preventDefault();return false;}
        // Ctrl+S — Save page
        if(e.ctrlKey&&e.key==='s'){e.preventDefault();return false;}
      });

      // ── Anti-DevTools: detect if DevTools is open and redirect ────────────
      (function(){
        var threshold=160;
        var devtoolsOpen=false;
        function check(){
          var w=window.outerWidth-window.innerWidth>threshold;
          var h=window.outerHeight-window.innerHeight>threshold;
          if(w||h){
            if(!devtoolsOpen){
              devtoolsOpen=true;
              // Clear the page content when DevTools detected
              document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#666"><p>Access denied.</p></div>';
            }
          } else {
            devtoolsOpen=false;
          }
        }
        setInterval(check,500);
      })();

      // ── Anti-DevTools: debugger trap (slows down inspection) ─────────────
      (function antiDebug(){
        try{
          (function(){
            // This creates an infinite loop in the debugger
            // making it impossible to step through code
          }).constructor('debugger')();
        }catch(e){}
        setTimeout(antiDebug,100);
      })();

        configurable:false,
        enumerable:false
      });
    </script>
