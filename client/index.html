<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRIMESTACK POS</title>
    <!-- Security: prevent iframing (clickjacking) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'" />
    <!-- Prevent browser from caching sensitive pages -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <!-- Remove referrer from outbound links -->
    <meta name="referrer" content="no-referrer" />
    <!-- Prevent search engine indexing of the POS dashboard -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <!-- © PRIMESTACK TECHNOLOGIES LLC — All rights reserved. Unauthorised access prohibited. -->
  </head>
  <body>
    <div id="root"></div>
    <div id="fallback" style="padding:20px;font-family:sans-serif;color:#666;text-align:center;">
      <p>Loading PRIMESTACK POS...</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // ── Hide fallback when React mounts ──────────────────────────────────
      setTimeout(function(){
        var r=document.getElementById('root');
        if(r&&r.children.length>0){
          var f=document.getElementById('fallback');
          if(f)f.style.display='none';
        }
      },2000);

      // ── Disable right-click context menu ─────────────────────────────────
      document.addEventListener('contextmenu',function(e){
        e.preventDefault();
        return false;
      });

      // ── Disable text selection (Ctrl+A, drag select) ─────────────────────
      document.addEventListener('selectstart',function(e){
        e.preventDefault();
        return false;
      });

      // ── Disable drag (drag to copy) ───────────────────────────────────────
      document.addEventListener('dragstart',function(e){
        e.preventDefault();
        return false;
      });

      // ── Disable keyboard shortcuts used to inspect source ─────────────────
      document.addEventListener('keydown',function(e){
        // F12 — DevTools
        if(e.key==='F12'){e.preventDefault();return false;}
        // Ctrl+Shift+I — DevTools
        if(e.ctrlKey&&e.shiftKey&&e.key==='I'){e.preventDefault();return false;}
        // Ctrl+Shift+J — Console
        if(e.ctrlKey&&e.shiftKey&&e.key==='J'){e.preventDefault();return false;}
        // Ctrl+Shift+C — Inspector
        if(e.ctrlKey&&e.shiftKey&&e.key==='C'){e.preventDefault();return false;}
        // Ctrl+U — View source
        if(e.ctrlKey&&e.key==='u'){e.preventDefault();return false;}
        // Ctrl+S — Save page
        if(e.ctrlKey&&e.key==='s'){e.preventDefault();return false;}
      });

      // ── Anti-DevTools: detect if DevTools is open ────────────────────────
      // Note: only blocks obvious DevTools usage, does not break normal browsing
      (function(){
        var threshold=300;
        var devtoolsOpen=false;
        function check(){
          var w=window.outerWidth-window.innerWidth>threshold;
          var h=window.outerHeight-window.innerHeight>threshold;
          if(w||h){
            if(!devtoolsOpen){ devtoolsOpen=true; }
          } else { devtoolsOpen=false; }
        }
        setInterval(check,1000);
      })();

      // ── Watermark: embed company identity ─────────────────────────────────
      // © 2026 PRIMESTACK TECHNOLOGIES LLC
      // Unauthorised copying, reverse engineering or redistribution
      // of this software is strictly prohibited.
      // Protected under international copyright law.
      Object.defineProperty(window,'_ps',{
        value:'\u00A9 2026 PRIMESTACK TECHNOLOGIES LLC. All rights reserved.',
        writable:false,
        configurable:false,
        enumerable:false
      });
    </script>
  </body>
</html>
