apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: primestack-staging

bases:
  - ../../base

namePrefix: staging-

images:
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/primestack-pos
    newTag: "staging"
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/primestack-vault-bank
    newTag: "staging"

patches:
  # Staging: 1 replica to save cost
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: primestack-api

  # Staging: smaller limits
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
    target:
      kind: Deployment
      name: primestack-api

commonAnnotations:
  deployment.kubernetes.io/environment: staging
