apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: primestack

bases:
  - ../../base

# Override image tags — CI/CD sets these to the git SHA
images:
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/primestack-pos
    newTag: "latest"
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/primestack-vault-bank
    newTag: "latest"

patches:
  # Production: 3 API replicas minimum
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: primestack-api

  # Production: higher resource limits
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
    target:
      kind: Deployment
      name: primestack-api

commonAnnotations:
  deployment.kubernetes.io/environment: production
