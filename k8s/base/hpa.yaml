# ── Horizontal Pod Autoscaler — Main API ─────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: primestack-api-hpa
  namespace: primestack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: primestack-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # 5 min cool-down before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
