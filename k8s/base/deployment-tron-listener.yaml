# ─────────────────────────────────────────────────────────────────────────────
# Tron Chain Listener
# Isolated pod — no inbound traffic, outbound only to TronGrid API.
# Watches for USDT TRC-20 deposits to the operator wallet and
# notifies the main API via internal service call.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primestack-tron-listener
  namespace: primestack
  labels:
    app: primestack-tron-listener
    component: chain-listener
    chain: tron
spec:
  replicas: 1              # Single instance per chain — no parallel listeners
  selector:
    matchLabels:
      app: primestack-tron-listener
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: primestack-tron-listener
        component: chain-listener
        chain: tron
    spec:
      serviceAccountName: primestack-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 30

      containers:
        - name: tron-listener
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/primestack-pos:latest
          imagePullPolicy: Always
          # Override CMD to run the Tron chain listener worker
          command: ["node", "/app/backend/dist/workers/tronListener.worker.js"]

          env:
            - name: NODE_ENV
              value: "production"
            - name: TRON_FULL_NODE
              value: "https://api.trongrid.io"
            - name: TRON_LISTENER_POLL_INTERVAL_MS
              value: "10000"           # Poll every 10 seconds
            - name: TRON_LISTENER_CONFIRMATIONS
              value: "19"              # TronGrid recommends 19 confirmations for finality
            - name: TRON_USDT_CONTRACT
              value: "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"  # USDT TRC-20 mainnet
            # Internal API callback — notify main API of confirmed deposits
            - name: INTERNAL_API_URL
              value: "http://primestack-api-svc:10000"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: primestack-secrets
                  key: API_KEYS

          envFrom:
            - secretRef:
                name: primestack-secrets

          # No inbound ports — outbound only
          # ports intentionally omitted

          livenessProbe:
            exec:
              # Check process is alive by verifying the worker file exists
              command: ["test", "-f", "/app/backend/dist/workers/tronListener.worker.js"]
            initialDelaySeconds: 10
            periodSeconds: 30

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      # ── Network policy — NO inbound, only outbound to TronGrid ───────────
      # (enforced by NetworkPolicy resource below)
      restartPolicy: Always
