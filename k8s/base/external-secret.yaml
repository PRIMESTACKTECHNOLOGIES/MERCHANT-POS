# ─────────────────────────────────────────────────────────────────────────────
# External Secrets Operator — AWS Secrets Manager integration
# Syncs secrets from AWS Secrets Manager into the K8s Secret automatically.
# Requires: External Secrets Operator installed in the cluster.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: primestack
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1              # Change to your EKS region
      auth:
        jwt:
          serviceAccountRef:
            name: primestack-sa      # IRSA — IAM Role for Service Account
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: primestack-secrets
  namespace: primestack
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: primestack-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: primestack/production
        property: JWT_SECRET
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: primestack/production
        property: ADMIN_PASSWORD
    - secretKey: CARD_PROCESSOR_KEY
      remoteRef:
        key: primestack/production
        property: CARD_PROCESSOR_KEY
    - secretKey: VAULT_BANK_API_KEY
      remoteRef:
        key: primestack/production
        property: VAULT_BANK_API_KEY
    - secretKey: VAULT_BANK_SECRET_KEY
      remoteRef:
        key: primestack/production
        property: VAULT_BANK_SECRET_KEY
    - secretKey: WISE_API_KEY
      remoteRef:
        key: primestack/production
        property: WISE_API_KEY
    - secretKey: BINANCE_API_KEY
      remoteRef:
        key: primestack/production
        property: BINANCE_API_KEY
    - secretKey: BINANCE_API_SECRET
      remoteRef:
        key: primestack/production
        property: BINANCE_API_SECRET
    - secretKey: TRON_PRIVATE_KEY
      remoteRef:
        key: primestack/production
        property: TRON_PRIVATE_KEY
    - secretKey: TRON_WALLET_ADDRESS
      remoteRef:
        key: primestack/production
        property: TRON_WALLET_ADDRESS
    - secretKey: TRON_API_KEY
      remoteRef:
        key: primestack/production
        property: TRON_API_KEY
    - secretKey: TRON_JWT_SECRET
      remoteRef:
        key: primestack/production
        property: TRON_JWT_SECRET
    - secretKey: PAN_ENCRYPTION_SECRET
      remoteRef:
        key: primestack/production
        property: PAN_ENCRYPTION_SECRET
    - secretKey: CARD_ENC_KEY
      remoteRef:
        key: primestack/production
        property: CARD_ENC_KEY
    - secretKey: TRANSAK_API_KEY
      remoteRef:
        key: primestack/production
        property: TRANSAK_API_KEY
    - secretKey: TRANSAK_API_SECRET
      remoteRef:
        key: primestack/production
        property: TRANSAK_API_SECRET
    - secretKey: ISSUER_SECRET_KEY
      remoteRef:
        key: primestack/production
        property: ISSUER_SECRET_KEY
