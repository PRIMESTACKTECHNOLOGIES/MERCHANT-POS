apiVersion: v1
kind: ConfigMap
metadata:
  name: primestack-config
  namespace: primestack
data:
  # App
  NODE_ENV: "production"
  PORT: "10000"
  SERVE_FRONTEND: "true"

  # Database (EFS persistent volume)
  DATABASE_PATH: "/data/database.sqlite"

  # Processor Identity
  PROCESSOR_NAME: "PRIMESTACK PAYMENT PROCESSOR"
  PROCESSOR_MODEL: "PRIMESTACK-POS-201.3"
  PROCESSOR_VERSION: "2.1.3"
  PROCESSOR_PROTOCOL: "201.3"
  PROCESSOR_MERCHANT_ID: "MRC-1001"
  PROCESSOR_TERMINAL_ID: "T2013-001"
  DEFAULT_TID: "T2013-001"
  MCC: "5999"
  PROCESSOR_FLOOR_LIMIT: "150000"
  PROCESSOR_KEY_ID: "PRIMESTACK-B4C329F83258"

  # Card Processor
  CARD_PROCESSOR_ENABLED: "true"
  CARD_PROCESSOR_URL: "https://processor.primestack-tech.com/api/v1/capture"
  CARD_PROCESSOR_LOOKUP_URL: "https://processor.primestack-tech.com/api/v1/lookup"
  CARD_PROCESSOR_CAPTURE_URL: "https://processor.primestack-tech.com/api/v1/capture"

  # Acquirer (http-json — no raw TCP on K8s ingress)
  ACQUIRER_PROTOCOL: "http-json"
  ACQUIRER_PORT: "443"
  ACQUIRER_TIMEOUT_MS: "8000"
  ACQUIRER_MERCHANT_ACCOUNT: "MRC-1001"

  # Vault Bank
  VAULT_BANK_PORT: "9001"
  VAULT_BANK_BIND_HOST: "0.0.0.0"
  VAULT_BANK_MODE: "LIVE"

  # Wise
  WISE_API_URL: "https://api.wise.com"
  WISE_PROFILE_ID: "94913186"
  INTERNAL_PAYOUT_DOWNSTREAM: "wise"
  WISE_RECEIVE_USD_ROUTING: "084009519"
  WISE_RECEIVE_USD_ACCOUNT: "343612919064346"
  WISE_RECEIVE_USD_SWIFT: "TRWIUS35XXX"
  WISE_RECEIVE_EUR_IBAN: "BE19905861593312"
  WISE_RECEIVE_EUR_BIC: "TRWIBEB1XXX"
  MERCHANT_IBAN: "BE19905861593312"
  MERCHANT_BIC: "TRWIBEB1XXX"

  # Tron
  TRON_FULL_NODE: "https://api.trongrid.io"

  # Binance
  BINANCE_MODE: "live"
  BINANCE_BASE_URL: "https://api.binance.com"
  EXCHANGE_PROVIDER_PRIORITY: "binance,transak,tronweb,bscweb,polygonweb,kucoin"

  # Transak
  TRANSAK_DEMO_MODE: "false"
  TRANSAK_MODE: "production"
  TRANSAK_BASE_URL: "https://api-gateway.transak.com"
  TRANSAK_PUBLIC_API_URL: "https://api.transak.com"
  TRANSAK_WIDGET_URL: "https://global.transak.com"
  TRANSAK_REFERRER_DOMAIN: "primestack-tech.com"

  # Jupiter
  JUPITER_MODE: "live"
  JUPITER_FORCE_LIVE: "1"
  JUPITER_BASE_URL: "https://quote-api.jup.ag/v6"

  # Operator cards
  OPERATOR_CARD_USD_HOLDER: "AJI ALOSIOUS"
  OPERATOR_CARD_USD_EXPIRY: "05/30"
  OPERATOR_CARD_USD_SCHEME: "VISA"
  OPERATOR_CARD_USD_CURRENCY: "USD"
  OPERATOR_CARD_EUR_HOLDER: "DANIA ALOSIOUS"
  OPERATOR_CARD_EUR_EXPIRY: "06/29"
  OPERATOR_CARD_EUR_SCHEME: "VISA"
  OPERATOR_CARD_EUR_CURRENCY: "EUR"

  # Payout
  BANK_PAYOUT_PROVIDER: "internal"
  ALLOW_LEGACY_CUSTOMER_CRYPTO_WITHDRAW_RAIL: "1"
  ABSA_ENVIRONMENT: "sandbox"
