# ─────────────────────────────────────────────────────────────────────────────
# WARNING: This file is a TEMPLATE only.
# Never commit real secrets to git.
# In production, use AWS Secrets Manager + External Secrets Operator to
# populate these values from AWS Secrets Manager automatically.
#
# To install External Secrets Operator:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets-operator --create-namespace
#
# Then create an ExternalSecret resource (see external-secret.yaml) instead of
# populating this file manually.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: primestack-secrets
  namespace: primestack
  annotations:
    # Managed by External Secrets Operator — do not edit manually
    externalsecrets.k8s-external-secrets.io/managed: "true"
type: Opaque
stringData:
  # Auth
  JWT_SECRET: "REPLACE_WITH_AWS_SECRET"
  ADMIN_PASSWORD: "REPLACE_WITH_AWS_SECRET"
  ADMIN_LOGIN_PASSWORD: "REPLACE_WITH_AWS_SECRET"

  # Card processor
  CARD_PROCESSOR_KEY: "REPLACE_WITH_AWS_SECRET"
  PROCESSOR_API_KEY: "REPLACE_WITH_AWS_SECRET"
  PROCESSOR_SECRET_KEY: "REPLACE_WITH_AWS_SECRET"
  ISSUER_SECRET_KEY: "REPLACE_WITH_AWS_SECRET"
  API_KEYS: "REPLACE_WITH_AWS_SECRET"

  # Vault bank
  VAULT_BANK_API_KEY: "REPLACE_WITH_AWS_SECRET"
  VAULT_BANK_SECRET_KEY: "REPLACE_WITH_AWS_SECRET"
  VAULT_ACTIVE_API_KEY: "REPLACE_WITH_AWS_SECRET"
  VAULT_BANK_WEBHOOK_SECRET: "REPLACE_WITH_AWS_SECRET"
  VAULT_EXTERNAL_LOAD_HMAC_SECRET: "REPLACE_WITH_AWS_SECRET"
  VAULT_CASH_OPERATOR_CODE: "REPLACE_WITH_AWS_SECRET"

  # Acquirer
  ACQUIRER_API_KEY: "REPLACE_WITH_AWS_SECRET"
  ACQUIRER_SECRET_KEY: "REPLACE_WITH_AWS_SECRET"

  # PAN encryption
  CARD_ENC_KEY: "REPLACE_WITH_AWS_SECRET"
  PAN_ENCRYPTION_SECRET: "REPLACE_WITH_AWS_SECRET"

  # Wise
  WISE_API_KEY: "REPLACE_WITH_AWS_SECRET"

  # Binance
  BINANCE_API_KEY: "REPLACE_WITH_AWS_SECRET"
  BINANCE_API_SECRET: "REPLACE_WITH_AWS_SECRET"

  # Tron (chain listener)
  TRON_PRIVATE_KEY: "REPLACE_WITH_AWS_SECRET"
  TRON_WALLET_ADDRESS: "REPLACE_WITH_AWS_SECRET"
  TRON_API_KEY: "REPLACE_WITH_AWS_SECRET"
  TRON_JWT_SECRET: "REPLACE_WITH_AWS_SECRET"

  # Transak
  TRANSAK_API_KEY: "REPLACE_WITH_AWS_SECRET"
  TRANSAK_API_SECRET: "REPLACE_WITH_AWS_SECRET"
  TRANSAK_WEBHOOK_SECRET: "REPLACE_WITH_AWS_SECRET"

  # Jupiter
  JUPITER_API_KEY: "REPLACE_WITH_AWS_SECRET"

  # Operator cards
  OPERATOR_CARD_USD_NUMBER: "REPLACE_WITH_AWS_SECRET"
  OPERATOR_CARD_USD_CVV: "REPLACE_WITH_AWS_SECRET"
  OPERATOR_CARD_EUR_NUMBER: "REPLACE_WITH_AWS_SECRET"
  OPERATOR_CARD_EUR_CVV: "REPLACE_WITH_AWS_SECRET"

  # ABSA
  ABSA_CLIENT_ID: "REPLACE_WITH_AWS_SECRET"
  ABSA_CLIENT_SECRET: "REPLACE_WITH_AWS_SECRET"
  ABSA_ACCOUNT_NUMBER: "REPLACE_WITH_AWS_SECRET"
  ABSA_WEBHOOK_SECRET: "REPLACE_WITH_AWS_SECRET"

  # Block explorers
  BSCSCAN_API_KEY: "REPLACE_WITH_AWS_SECRET"
  POLYGONSCAN_API_KEY: "REPLACE_WITH_AWS_SECRET"
  ETHERSCAN_API_KEY: "REPLACE_WITH_AWS_SECRET"
