apiVersion: apps/v1
kind: Deployment
metadata:
  name: primestack-api
  namespace: primestack
  labels:
    app: primestack-api
    component: backend
    version: "2.1.3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: primestack-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # Zero-downtime deployment
      maxSurge: 1
  template:
    metadata:
      labels:
        app: primestack-api
        component: backend
      annotations:
        # Force pod restart when secrets change
        checksum/config: "{{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}"
    spec:
      serviceAccountName: primestack-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60

      containers:
        - name: api
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/primestack-pos:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 10000
              protocol: TCP

          # ── Environment from ConfigMap ────────────────────────────────────
          envFrom:
            - configMapRef:
                name: primestack-config
            - secretRef:
                name: primestack-secrets

          # ── Runtime-injected values ───────────────────────────────────────
          env:
            - name: VITE_API_URL
              value: "https://api.primestack-tech.com"
            - name: ACQUIRER_HOST
              value: "https://api.primestack-tech.com"
            - name: VAULT_BANK_TRANSFER_URL
              value: "https://vault.primestack-tech.com/api/vault/settlement"

          # ── Persistent storage ────────────────────────────────────────────
          volumeMounts:
            - name: data
              mountPath: /data

          # ── Health checks ─────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: 10000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 10000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          # ── Resource limits ───────────────────────────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          # ── Security ──────────────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: primestack-data-pvc

      # ── Pod anti-affinity — spread across AZs ────────────────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["primestack-api"]
                topologyKey: topology.kubernetes.io/zone
