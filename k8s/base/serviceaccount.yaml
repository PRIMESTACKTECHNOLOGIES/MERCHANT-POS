# IRSA — IAM Role for Service Account
# The IAM role ARN is set by the EKS admin after creating the role in AWS.
# Replace ACCOUNT_ID and ROLE_NAME with your values.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: primestack-sa
  namespace: primestack
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/primestack-eks-role"
