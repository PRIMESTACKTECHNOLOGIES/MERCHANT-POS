# ─────────────────────────────────────────────────────────────────────────────
# Persistent Volume Claim — EFS (AWS Elastic File System)
# EFS gives ReadWriteMany access across pods.
# Requires: EFS CSI Driver installed in EKS.
#   kubectl apply -k "github.com/kubernetes-sigs/aws-efs-csi-driver/deploy/kubernetes/overlays/stable/?ref=release-1.x"
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: primestack-data-pvc
  namespace: primestack
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc        # EFS StorageClass — created by EFS CSI driver
  resources:
    requests:
      storage: 10Gi
---
# EFS StorageClass (apply once per cluster)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-REPLACE_WITH_EFS_ID    # Your EFS File System ID from AWS Console
  directoryPerms: "700"
  gidRangeStart: "1000"
  gidRangeEnd:   "2000"
  basePath: "/primestack-data"
