apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: primestack

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - external-secret.yaml
  - pvc.yaml
  - deployment-api.yaml
  - deployment-vault-bank.yaml
  - deployment-tron-listener.yaml
  - services.yaml
  - ingress.yaml
  - hpa.yaml
  - network-policy.yaml
  - poddisruptionbudget.yaml

commonLabels:
  app.kubernetes.io/name: primestack-pos
  app.kubernetes.io/managed-by: kustomize
